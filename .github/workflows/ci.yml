name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    env:
      # Laravel 10 and 11 have known security advisories, and Composer blocks
      # installing them by default. They are installed here on purpose, only to
      # test the package's compatibility.
      COMPOSER_NO_SECURITY_BLOCKING: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', laravel: '10', testbench: '^8.0' }
          - { php: '8.2', laravel: '10', testbench: '^8.0' }
          - { php: '8.3', laravel: '10', testbench: '^8.0' }
          - { php: '8.2', laravel: '11', testbench: '^9.0' }
          - { php: '8.3', laravel: '11', testbench: '^9.0' }
          - { php: '8.2', laravel: '12', testbench: '^10.0' }
          - { php: '8.3', laravel: '12', testbench: '^10.0' }
          - { php: '8.3', laravel: '13', testbench: '^11.0' }

    steps:
      - uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, tokenizer, xml, xmlwriter
          coverage: none

      - name: Pin the Laravel version (via Testbench)
        run: >
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}"
          --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run the tests
        run: vendor/bin/phpunit

  quality:
    name: Code style and static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring, tokenizer, xml, xmlwriter
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Code style (Pint)
        run: composer lint

      - name: Static analysis (PHPStan)
        run: composer analyse
